
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Grand Horizon Hotel</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f3f5f4;
            color: #24312d;
        }
        .card {
            width: 100%;
            max-width: 430px;
            padding: 32px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 8px 28px #00000012;
        }
        h1 { margin-top: 0; color: #173b35; }
        p { line-height: 1.5; }
        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd3cf;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: 0;
            border-radius: 6px;
            background: #173b35;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        .error { color: #b00020; }
        .success { color: #176b35; }
        a { color: #176b55; }
        .back { margin-top: 20px; }
    </style>
</head>
<body>
<div class="card">
    <h1>Create your account</h1>
    <p>Join Grand Horizon Hotel to make your stay easier.</p>

    <p class="error" th:if="${error}" th:text="${error}"></p>
    <p class="success" th:if="${success}" th:text="${success}"></p>

    <form th:action="@{/register}" method="post">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text"
               maxlength="100" autocomplete="name" required>

        <label for="email">Email address</label>
        <input id="email" name="email" type="email"
               maxlength="150" autocomplete="email" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password"
               minlength="8" maxlength="72"
               autocomplete="new-password" required>

        <button type="submit">Create Account</button>
    </form>

    <p class="back">Already registered? <a href="/login">Log in</a></p>
    <p><a href="/">Back to hotel home</a></p>
</div>
</body>
</html>
