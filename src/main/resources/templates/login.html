
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Grand Horizon Hotel</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f3f5f4;
            color: #24312d;
        }
        .card {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 8px 28px #00000012;
        }
        h1 { color: #173b35; margin-top: 0; }
        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd3cf;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: 0;
            border-radius: 6px;
            background: #173b35;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        .error { color: #b00020; }
        .success { color: #176b35; }
        a { color: #176b55; }
    </style>
</head>
<body>
<div class="card">
    <h1>Welcome Back</h1>
    <p>Log in to Grand Horizon Hotel.</p>

    <p class="error" th:if="${param.error}">
        Invalid username/email or password. Please try again.
    </p>
    <p class="success" th:if="${param.logout}">
        You have been logged out.
    </p>
    <p class="success" th:if="${success}" th:text="${success}"></p>

    <form th:action="@{/login}" method="post">
        <label for="username">Admin username or customer email</label>
        <input id="username" name="username" type="text"
               autocomplete="username" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password"
               autocomplete="current-password" required>

        <button type="submit">Log In</button>
    </form>

    <p>New customer? <a href="/register">Create an account</a></p>
    <p><a href="/">Back to hotel home</a></p>
</div>
</body>
</html>
